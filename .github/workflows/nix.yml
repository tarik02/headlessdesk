name: nix

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Configure cache
        uses: cachix/cachix-action@v17
        with:
          name: tarik02-headlessdesk
          skipPush: true

      - name: Build package
        run: |
          nix build --no-link --print-out-paths --print-build-logs .#default \
            > "$RUNNER_TEMP/nix-package-paths"

      - name: Smoke-test package
        run: |
          headlessdesk="$(nix eval --raw .#default.outPath)"
          "$headlessdesk/bin/headlessdesk" --help

      # Release tags point at commits already built here, so master is the
      # only ref that needs to publish. PR jobs never receive this token.
      - name: Publish package closure
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          cachix push tarik02-headlessdesk < "$RUNNER_TEMP/nix-package-paths"
